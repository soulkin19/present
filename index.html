<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>運営専用 | 贈り物システム</title>
    <style>
        body { font-family: 'Helvetica Neue', Arial, sans-serif; background-color: #f0f2f5; margin: 0; padding: 20px; color: #333; }
        .admin-card { max-width: 500px; margin: 40px auto; background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #1a73e8; border-bottom: 2px solid #e8f0fe; padding-bottom: 10px; }
        
        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; font-size: 13px; font-weight: bold; margin-bottom: 8px; color: #555; }
        .input-group input { width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 16px; outline: none; transition: 0.3s; }
        .input-group input:focus { border-color: #1a73e8; }
        
        .btn-container { display: flex; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
        .btn { flex: 1; min-width: 120px; padding: 15px; border: none; border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer; transition: 0.2s; color: white; }
        .btn-plus { background-color: #34a853; }
        .btn-minus { background-color: #ea4335; }
        .btn-update { background-color: #1a73e8; }
        .btn-delete { background-color: #5f6368; }
        .btn-bulk-delete { background-color: #000; width: 100%; margin-top: 10px; }
        .btn:hover { opacity: 0.8; }
        
        .status-msg { text-align: center; margin-top: 15px; padding: 10px; border-radius: 5px; font-size: 14px; display: none; }
        
        .user-list-mini { margin-top: 30px; font-size: 13px; color: #333; max-height: 200px; overflow-y: auto; border: 1px solid #ddd; padding: 10px; border-radius: 5px; background: #fafafa; }
        .user-item { display: flex; align-items: center; padding: 8px; border-bottom: 1px solid #eee; gap: 10px; }
        .user-item:hover { background: #f0f7ff; }
        .user-name-label { cursor: pointer; flex-grow: 1; }
        
        hr { border: 0; border-top: 1px solid #eee; margin: 20px 0; }
    </style>
</head>
<body>

    <div class="admin-card">
        <h2>🎁 贈り物・アカウント管理</h2>
        
        <div class="input-group">
            <label>対象ユーザー名（ID）※個別操作用</label>
            <input type="text" id="target-user" placeholder="例: 田中太郎">
            
            <div id="user-suggestions" class="user-list-mini">ユーザー読み込み中...</div>
            <button class="btn btn-bulk-delete" onclick="bulkDeleteUsers()">選択したユーザーを一括削除</button>
        </div>

        <div class="input-group">
            <label>数値操作 / 新しいパスワード</label>
            <input type="text" id="action-value" placeholder="pt数 または 新パスワード">
        </div>

        <div class="input-group">
            <label>運営パスワード</label>
            <input type="password" id="admin-pass" placeholder="運営用パスを入力">
        </div>

        <div class="btn-container">
            <button class="btn btn-plus" onclick="adjustPoints('plus')">付与 (+)</button>
            <button class="btn btn-minus" onclick="adjustPoints('minus')">没収 (-)</button>
        </div>

        <hr>

        <div class="btn-container">
            <button class="btn btn-update" onclick="updateUserAccount('password')">パスワード変更</button>
            <button class="btn btn-delete" onclick="updateUserAccount('delete')">個別削除</button>
        </div>

        <div id="status" class="status-msg"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, get, update, increment, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCwhHspaG94goiCIjVj3h-Un5pBK3JTjMU",
            authDomain: "soulkin-aa3b7.firebaseapp.com",
            databaseURL: "https://soulkin-aa3b7-default-rtdb.firebaseio.com",
            projectId: "soulkin-aa3b7",
            storageBucket: "soulkin-aa3b7.firebasestorage.app",
            messagingSenderId: "358331064206",
            appId: "1:358331064206:web:d7760ea0919259418a4edf"
        };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const ADMIN_PW = "delta437";

        // ユーザー一覧の読み込み（チェックボックス付き）
        const loadUserSuggestions = async () => {
            const snap = await get(ref(db, 'users'));
            const container = document.getElementById('user-suggestions');
            if(snap.exists()) {
                container.innerHTML = "<b>一括削除するユーザーを選択:</b><br>";
                Object.keys(snap.val()).forEach(name => {
                    const div = document.createElement('div');
                    div.className = 'user-item';
                    
                    const cb = document.createElement('input');
                    cb.type = 'checkbox';
                    cb.className = 'user-select-cb';
                    cb.value = name;

                    const label = document.createElement('span');
                    label.className = 'user-name-label';
                    label.innerText = name;
                    // 名前クリックで個別操作用の入力欄にセット
                    label.onclick = () => document.getElementById('target-user').value = name;

                    div.appendChild(cb);
                    div.appendChild(label);
                    container.appendChild(div);
                });
            } else {
                container.innerText = "ユーザーがいません。";
            }
        };

        // ポイント調整
        window.adjustPoints = async (type) => {
            const user = document.getElementById('target-user').value.trim();
            const amount = parseInt(document.getElementById('action-value').value);
            const pass = document.getElementById('admin-pass').value;

            if (!user || isNaN(amount) || amount <= 0) return showStatus("ユーザー名と正しい数値を入力してください", "error");
            if (pass !== ADMIN_PW) return showStatus("運営パスワードが違います", "error");

            try {
                const userRef = ref(db, `users/${user}`);
                const snap = await get(userRef);
                if (!snap.exists()) return showStatus("ユーザーが見つかりません", "error");

                const finalChange = (type === 'plus') ? amount : -amount;
                await update(userRef, { score: increment(finalChange) });
                showStatus(`${user}さんに ${finalChange}pt 反映しました！`, "success");
            } catch (e) {
                showStatus("エラー: " + e.message, "error");
            }
        };

        // 個別アカウント管理
        window.updateUserAccount = async (action) => {
            const user = document.getElementById('target-user').value.trim();
            const val = document.getElementById('action-value').value.trim();
            const pass = document.getElementById('admin-pass').value;

            if (!user) return showStatus("ユーザー名を選択してください", "error");
            if (pass !== ADMIN_PW) return showStatus("運営パスワードが違います", "error");

            try {
                const userRef = ref(db, `users/${user}`);
                if (action === 'password') {
                    if (!val) return showStatus("新しいパスワードを入力してください", "error");
                    await update(userRef, { password: val });
                    showStatus(`${user}さんのパスワードを更新しました`, "success");
                } else if (action === 'delete') {
                    if (!confirm(`${user}を削除しますか？`)) return;
                    await remove(userRef);
                    showStatus(`${user}を削除しました`, "success");
                    loadUserSuggestions();
                }
            } catch (e) {
                showStatus("エラー: " + e.message, "error");
            }
        };

        // 【新機能】一括削除
        window.bulkDeleteUsers = async () => {
            const pass = document.getElementById('admin-pass').value;
            const selected = Array.from(document.querySelectorAll('.user-select-cb:checked')).map(cb => cb.value);

            if (selected.length === 0) return showStatus("削除するユーザーをチェックしてください", "error");
            if (pass !== ADMIN_PW) return showStatus("運営パスワードが違います", "error");
            if (!confirm(`選択された ${selected.length} 名のユーザーを完全に削除しますか？`)) return;

            try {
                const deletePromises = selected.map(name => remove(ref(db, `users/${name}`)));
                await Promise.all(deletePromises);
                showStatus(`${selected.length} 名のユーザーを一括削除しました`, "success");
                loadUserSuggestions();
            } catch (e) {
                showStatus("一括削除中にエラーが発生しました: " + e.message, "error");
            }
        };

        const showStatus = (msg, type) => {
            const status = document.getElementById('status');
            status.style.display = 'block';
            status.innerText = msg;
            status.style.backgroundColor = (type === 'success') ? '#e6ffed' : '#fff0f0';
            status.style.color = (type === 'success') ? '#22863a' : '#cb2431';
        };

        window.onload = loadUserSuggestions;
    </script>
</body>
</html>
