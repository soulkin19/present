<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>運営専用 | 贈り物・管理システム</title>
    <style>
        :root { --primary: #1a73e8; --danger: #ea4335; --success: #34a853; --gray: #5f6368; }
        body { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background-color: #f8f9fa; margin: 0; padding: 20px; color: #333; }
        .admin-card { max-width: 550px; margin: 20px auto; background: #fff; padding: 25px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        h2 { text-align: center; color: var(--primary); font-size: 1.5rem; margin-bottom: 25px; }
        
        .input-group { margin-bottom: 18px; }
        .input-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: #666; }
        .input-group input { width: 100%; padding: 12px; border: 1px solid #dadce0; border-radius: 8px; box-sizing: border-box; font-size: 15px; outline: none; transition: 0.2s; }
        .input-group input:focus { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(26,115,232,0.1); }
        
        /* ユーザーリストのUI改善 */
        .user-container { border: 1px solid #dadce0; border-radius: 8px; background: #fff; margin-bottom: 15px; overflow: hidden; }
        .user-list-header { background: #f1f3f4; padding: 10px 15px; border-bottom: 1px solid #dadce0; display: flex; align-items: center; font-size: 13px; font-weight: bold; }
        .user-list-mini { max-height: 220px; overflow-y: auto; padding: 0; }
        .user-item { display: flex; align-items: center; padding: 10px 15px; border-bottom: 1px solid #f1f3f4; transition: 0.2s; gap: 12px; }
        .user-item:last-child { border-bottom: none; }
        .user-item:hover { background: #f8f9ff; }
        
        .user-item input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; flex-shrink: 0; }
        .user-name-label { cursor: pointer; font-size: 14px; color: #3c4043; word-break: break-all; line-height: 1.4; flex-grow: 1; }
        
        /* ボタン類 */
        .btn-container { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
        .btn { padding: 12px; border: none; border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer; transition: 0.2s; color: white; display: flex; align-items: center; justify-content: center; }
        .btn-plus { background-color: var(--success); }
        .btn-minus { background-color: var(--danger); }
        .btn-update { background-color: var(--primary); }
        .btn-delete { background-color: var(--gray); }
        .btn-bulk-delete { background-color: #202124; width: 100%; margin: 10px 0; grid-column: span 2; }
        .btn:hover { filter: brightness(90%); }
        .btn:active { transform: scale(0.98); }
        
        .status-msg { text-align: center; margin-top: 15px; padding: 10px; border-radius: 8px; font-size: 13px; display: none; }
        hr { border: 0; border-top: 1px solid #eee; margin: 20px 0; }
    </style>
</head>
<body>

    <div class="admin-card">
        <h2>🎁 贈り物・アカウント管理</h2>
        
        <div class="input-group">
            <label>対象ユーザー名（クリックで選択）</label>
            <input type="text" id="target-user" placeholder="ユーザー名を直接入力または下から選択">
            
            <div class="user-container">
                <div class="user-list-header">
                    <input type="checkbox" id="select-all" onclick="toggleAll(this)">
                    <span style="margin-left: 10px;">全選択 / ユーザーリスト</span>
                </div>
                <div id="user-suggestions" class="user-list-mini">ユーザー読み込み中...</div>
            </div>
            
            <button class="btn btn-bulk-delete" onclick="bulkDeleteUsers()">選択したユーザーを一括削除</button>
        </div>

        <div class="input-group">
            <label>数値操作 / 新しいパスワード</label>
            <input type="text" id="action-value" placeholder="pt数 または 新パスワード">
        </div>

        <div class="input-group">
            <label>運営パスワード</label>
            <input type="password" id="admin-pass" placeholder="運営用パスを入力">
        </div>

        <div class="btn-container">
            <button class="btn btn-plus" onclick="adjustPoints('plus')">付与 (+)</button>
            <button class="btn btn-minus" onclick="adjustPoints('minus')">没収 (-)</button>
        </div>

        <hr>

        <div class="btn-container">
            <button class="btn btn-update" onclick="updateUserAccount('password')">パスワード変更</button>
            <button class="btn btn-delete" onclick="updateUserAccount('delete')">個別に削除</button>
        </div>

        <div id="status" class="status-msg"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, get, update, increment, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCwhHspaG94goiCIjVj3h-Un5pBK3JTjMU",
            authDomain: "soulkin-aa3b7.firebaseapp.com",
            databaseURL: "https://soulkin-aa3b7-default-rtdb.firebaseio.com",
            projectId: "soulkin-aa3b7",
            storageBucket: "soulkin-aa3b7.firebasestorage.app",
            messagingSenderId: "358331064206",
            appId: "1:358331064206:web:d7760ea0919259418a4edf"
        };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const ADMIN_PW = "delta437";

        // 全選択・解除
        window.toggleAll = (source) => {
            const checkboxes = document.querySelectorAll('.user-select-cb');
            checkboxes.forEach(cb => cb.checked = source.checked);
        };

        // ユーザー一覧読み込み
        const loadUserSuggestions = async () => {
            const container = document.getElementById('user-suggestions');
            try {
                const snap = await get(ref(db, 'users'));
                if(snap.exists()) {
                    container.innerHTML = "";
                    Object.keys(snap.val()).forEach(name => {
                        const div = document.createElement('div');
                        div.className = 'user-item';
                        div.innerHTML = `
                            <input type="checkbox" class="user-select-cb" value="${name}">
                            <span class="user-name-label">${name}</span>
                        `;
                        div.querySelector('.user-name-label').onclick = () => {
                            document.getElementById('target-user').value = name;
                        };
                        container.appendChild(div);
                    });
                } else {
                    container.innerHTML = "<div style='padding:15px; font-size:12px; color:#999;'>ユーザーが登録されていません。</div>";
                }
            } catch (e) {
                container.innerText = "読込失敗: " + e.message;
            }
        };

        // ポイント調整
        window.adjustPoints = async (type) => {
            const user = document.getElementById('target-user').value.trim();
            const amount = parseInt(document.getElementById('action-value').value);
            const pass = document.getElementById('admin-pass').value;

            if (!user || isNaN(amount)) return showStatus("ユーザー名と数値を入力してください", "error");
            if (pass !== ADMIN_PW) return showStatus("パスワードが違います", "error");

            try {
                const userRef = ref(db, `users/${user}`);
                const snap = await get(userRef);
                if (!snap.exists()) return showStatus("ユーザーが見つかりません", "error");

                const change = (type === 'plus') ? amount : -amount;
                await update(userRef, { score: increment(change) });
                showStatus(`${user}さんに ${change}pt 反映しました`, "success");
            } catch (e) { showStatus("エラー: " + e.message, "error"); }
        };

        // 個別アカウント管理
        window.updateUserAccount = async (action) => {
            const user = document.getElementById('target-user').value.trim();
            const val = document.getElementById('action-value').value.trim();
            const pass = document.getElementById('admin-pass').value;

            if (!user) return showStatus("ユーザー名を入力してください", "error");
            if (pass !== ADMIN_PW) return showStatus("パスワードが違います", "error");

            try {
                const userRef = ref(db, `users/${user}`);
                if (action === 'password') {
                    if (!val) return showStatus("新しいパスワードを入力してください", "error");
                    await update(userRef, { password: val });
                    showStatus(`${user}のパスワードを更新しました`, "success");
                } else if (action === 'delete') {
                    if (!confirm(`${user}を削除しますか？`)) return;
                    await remove(userRef);
                    showStatus(`${user}を削除しました`, "success");
                    loadUserSuggestions();
                }
            } catch (e) { showStatus("エラー: " + e.message, "error"); }
        };

        // 一括削除
        window.bulkDeleteUsers = async () => {
            const pass = document.getElementById('admin-pass').value;
            const selected = Array.from(document.querySelectorAll('.user-select-cb:checked')).map(cb => cb.value);

            if (selected.length === 0) return showStatus("削除するユーザーを選択してください", "error");
            if (pass !== ADMIN_PW) return showStatus("運営パスワードが違います", "error");
            if (!confirm(`選択した ${selected.length} 名を完全に削除しますか？`)) return;

            try {
                await Promise.all(selected.map(name => remove(ref(db, `users/${name}`))));
                showStatus(`${selected.length} 名を削除しました`, "success");
                document.getElementById('select-all').checked = false;
                loadUserSuggestions();
            } catch (e) { showStatus("一括削除エラー: " + e.message, "error"); }
        };

        const showStatus = (msg, type) => {
            const status = document.getElementById('status');
            status.style.display = 'block';
            status.innerText = msg;
            status.style.backgroundColor = (type === 'success') ? '#e6ffed' : '#fff0f0';
            status.style.color = (type === 'success') ? '#22863a' : '#cb2431';
        };

        window.onload = loadUserSuggestions;
    </script>
</body>
</html>
